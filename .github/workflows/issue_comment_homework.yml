name: Create Issue on Push

on:
  push:

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    if: ${{ github.event.deleted == false }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      PUSHER: ${{ github.event.pusher.name }}
      REF_NAME: ${{ github.ref_name }}
      COMPARE_URL: ${{ github.event.compare }}
      COMMIT_IDS: ${{ join(github.event.commits.*id, ' ') }}

    steps:
      - name: Build issue title/body
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COUNT=$(echo "$COMMIT_IDS" | wc -w)

          {
            echo "## PUSH information"
            echo ""
            echo "- **BRANCH**: \`${REF_NAME}\`"
            echo "- **PUSHER**: @${PUSHER}"
            echo "- **COMMIT NUMB**: ${COUNT}"
            echo "- **RECENT COMMIT**: \`${SHORT_SHA}\`"
            echo "- **DIFF**: ${COMPARE_URL}"
            echo ""
            echo "### RECENT COMMIT MSG"
            echo '```'
            echo "${COMMIT_MSG}"
            echo '```'
          } > issue_boyd.md

          echo "ISSUE_TITLE=[Push] ${REF_NAME} @ ${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Create issue with Github CLI
        if: ${{ env.METHOD == 'gh' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY_RUN] gh api POST repos/$GITHUB_REPOSITORY/issues (skipped)"
            exit 0
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="$ISSUE_TITLE" \
            -F body=@issue_body.md \
            --jq '.html_url'

      - name: Create issue with curl
        if: ${{ env.METHOD == 'curl' }}
        run: |
          jq -n --arg title "$ISSUE_TITLE" --rawfile body issue_body.md \
            '{title: $title, body: $body}' > payload.json

          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY_RUN] curl POST payload:"
            cat payload.json
            exit 0
          fi

          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vn.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-Github-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d @payload.json
